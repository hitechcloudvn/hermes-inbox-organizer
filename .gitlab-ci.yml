# Song ngữ: CI GitLab — kiểm thử mọi nhánh, phát hành khi có tag v* /
# GitLab CI — test on every branch, release on v* tags.
stages:
  - test
  - release

default:
  image: python:3.13-alpine

test:
  stage: test
  script:
    - pip install --quiet --ignore-requires-python -e ".[dev]"
    - python -m py_compile hermes_inbox_organizer/__init__.py
    - python -m pytest -q

# Tạo GitLab Release khi có tag v* / create the GitLab Release on v* tags.
# Không dùng keyword `release:` — runner 19.6+ yêu cầu glab/release-cli trong
# image chạy job và embed mô tả markdown vào shell script (backtick bị thực thi).
# Gọi Releases API trực tiếp qua .ci/create_gitlab_release.py — xem docstring.
# Not using the `release:` keyword — runner 19.6+ needs glab/release-cli inside
# the job image and embeds the markdown notes into shell code (backticks get
# executed). We call the Releases API directly via .ci/create_gitlab_release.py
# — see that file's docstring.
release:
  stage: release
  image: python:3.13-alpine
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - python -u .ci/create_gitlab_release.py
  # Giữ release-response.json đọc được cả khi lỗi / keep release-response.json
  # readable even if the call fails
  artifacts:
    when: always
    paths:
      - release-response.json
    expire_in: 30 days
