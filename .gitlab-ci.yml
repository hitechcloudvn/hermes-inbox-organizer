# Song ngữ: CI GitLab — kiểm thử mọi nhánh, phát hành khi có tag v* /
# GitLab CI — test on every branch, release on v* tags.
stages:
  - test
  - release

default:
  image: python:3.13-alpine

test:
  stage: test
  script:
    - pip install --quiet --ignore-requires-python -e ".[dev]"
    - python -m py_compile hermes_inbox_organizer/__init__.py
    - python -m pytest -q

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Publishing release $CI_COMMIT_TAG / Phát hành $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "hermes-inbox-organizer $CI_COMMIT_TAG — see CHANGELOG / xem CHANGELOG"
