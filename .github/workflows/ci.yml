name: CI

# Song ngữ: Kiểm thử tự động / Automated checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Kiểm thử / Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Cài Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Kiểm tra cú pháp Python / Python syntax check
        run: python -m py_compile hermes_inbox_organizer/__init__.py

      - name: Cài phụ thuộc / Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --ignore-requires-python -e ".[dev]"

      - name: Kiểm thử / Run tests
        run: python -m pytest -q

  lint:
    name: Kiểm tra tĩnh / Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cài phụ thuộc / Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff / Lint
        run: ruff check .

      - name: Mypy / Type-check
        run: mypy

      - name: Kiểm tra bản quyền / License file check
        run: test -f LICENSE && echo "LICENSE OK"
