name: Release

# Song ngữ: Phát hành GitHub Release khi đẩy tag v* — dựng gói trong CI, không dựng
# cục bộ, không đăng PyPI /
# Publish a GitHub Release when a v* tag is pushed (built by CI, not locally).
# Does NOT publish to PyPI — dist/* is attached to the GitHub Release only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Phát hành / Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Python / Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cài phụ thuộc / Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Kiểm thử / Run tests
        run: python -m pytest -q

      - name: Kiểm tra tag khớp version / Assert tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pkg — bump the version before tagging."
            exit 1
          fi

      - name: Đóng gói + kiểm tra gói / Build + check distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Tạo GitHub Release / Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: hermes-inbox-organizer ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
